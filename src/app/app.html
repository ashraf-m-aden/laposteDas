  de page dit deja la meme chose, mais personne ne fait defiler une demo avant
  de la croire. Il ne s'affiche que si `environment.useMock` est vrai — en
  production il n'existe pas dans le rendu.
-->

    Maquette de démonstration — colis, comptes et tarifs sont des
    <strong>données factices</strong>. La carte, elle, montre le vrai
    référentiel D.A.S.
  </p>
}
